product: Atlas Knowledge
release: "4.2"
release_date: 2026-11-30
changes:
  - id: C1
    title: Search API v1 deprecated
    type: api_deprecation
    breaking: true
    audience: [developer, partner]
    visibility: external
    removal_release: "4.3"
    description: >
      GET /v1/search is deprecated. Use GET /v2/search, which requires a
      locale query parameter (for example en-US). v1 remains supported
      through release 4.4.  